services:
  - type: web
    name: aerolytics-api
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: AERO_CORS_ORIGINS
        value: "*"
      - key: AERO_PRELOAD
        value: "0"
      - key: AERO_CONF
        value: "0.25"


