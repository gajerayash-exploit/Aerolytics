<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,75..125,300..800;1,75..125,300..800&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
  <style>
/*SHELL_CSS*/

    .lost { position: relative; height: 900px; overflow: hidden; background: #02060F; }
    .noise { position: absolute; inset: -50%; pointer-events: none; opacity: .12; background: repeating-radial-gradient(circle at 17% 32%, rgba(255,255,255,.5) 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 73% 61%, rgba(255,255,255,.4) 0 1px, transparent 1px 4px); animation: jitter .18s steps(3) infinite; }
    .scan { position: absolute; left: 0; right: 0; height: 120px; pointer-events: none; background: linear-gradient(180deg, rgba(92,225,255,0), rgba(92,225,255,.06), rgba(92,225,255,0)); animation: sweep 5s linear infinite; }
    .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(2,6,15,.92) 0%, rgba(2,6,15,.55) 38%, rgba(2,6,15,0) 62%), radial-gradient(120% 100% at 60% 50%, rgba(0,0,0,0) 50%, rgba(0,0,0,.7) 100%); }
    @keyframes jitter { 33% { transform: translate(3px, -2px); } 66% { transform: translate(-2px, 3px); } }
    @keyframes sweep { from { top: -120px; } to { top: 900px; } }
    @keyframes glitch { 0%, 92%, 100% { transform: none; opacity: 1; } 94% { transform: translateX(-4px) skewX(-6deg); opacity: .7; } 96% { transform: translateX(3px); opacity: .9; } }
    .top { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; padding: 26px 48px; z-index: 3; }
    .top img { height: 38px; width: auto; display: block; }
    /* logo lockup: mark and wordmark on one centred line */
    .lockup { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
    :where(.lockup) { height: 34px; }
    :where(.lockup) img { height: 100%; width: auto; display: block; }
    .lockup b { font-family: 'Saira', 'Bahnschrift', sans-serif; font-stretch: 118%; font-style: italic; font-weight: 700; font-size: 20px; line-height: 1; letter-spacing: .01em; color: #fff; white-space: nowrap; text-transform: none; }
    .copy { position: absolute; left: 48px; top: 210px; width: 600px; z-index: 3; }
    .code { font-family: 'Saira', 'Bahnschrift', sans-serif; font-stretch: 125%; font-style: italic; font-weight: 800; font-size: 150px; line-height: .9; color: transparent; -webkit-text-stroke: 1.5px #5CE1FF; animation: glitch 4s infinite; }
    .code.err { -webkit-text-stroke-color: #FF6A3D; }
    .copy h1 { margin: 16px 0 0; font-family: 'Saira', 'Bahnschrift', sans-serif; font-stretch: 120%; font-style: italic; font-weight: 700; font-size: 56px; line-height: .95; text-transform: uppercase; color: #fff; }
    .copy p { margin: 18px 0 0; max-width: 500px; font-size: 17px; line-height: 1.6; color: #A9B8D0; text-wrap: pretty; }
    .copy .acts { margin-left: 0; margin-top: 32px; }
    .hud { position: absolute; right: 48px; bottom: 44px; width: 340px; z-index: 3; padding: 14px 16px; }
    .hud .kvl-row { padding: 0; }
    .variant { position: absolute; left: 48px; bottom: 44px; z-index: 3; display: flex; align-items: center; gap: 12px; }
  </style>
</helmet>

<div class="lost">
  <canvas class="gl" data-gl="lost"></canvas>
  <div class="shade"></div>
  <div class="noise"></div>
  <div class="scan"></div>

  <header class="top">
    <span class="lockup"><img src="logo-mark.png" alt=""><b>Aerolytics</b></span>
    <span class="{{ v.badgeCls }}">{{ v.badge }}</span>
  </header>

  <section class="copy">
    <div class="kicker" style="color: {{ v.color }}"><i></i>{{ v.kicker }}</div>
    <div class="{{ v.codeCls }}">{{ v.code }}</div>
    <h1>{{ v.title }}</h1>
    <p>{{ v.body }}</p>
    <div class="acts">
      <a class="btn btn-primary" href="#">{{ v.primary }}</a>
      <a class="btn btn-ghost" href="#">{{ v.secondary }}</a>
    </div>
  </section>

  <aside class="glass hud">
    <div class="hud-head" style="display: flex; justify-content: space-between; margin-bottom: 8px"><span class="lbl strong">Last known position</span><span class="chip" style="color: {{ v.color }}">{{ v.link }}</span></div>
    <sc-for list="{{ v.rows }}" as="r" hint-placeholder-count="4"><div class="kvl-row"><span>{{ r.k }}</span><b>{{ r.v }}</b><i></i></div></sc-for>
  </aside>

  <div class="variant">
    <span class="lbl">Variant</span>
    <div class="segs"><sc-for list="{{ variants }}" as="o" hint-placeholder-count="2"><button class="{{ o.cls }}" onClick="{{ o.pick }}">{{ o.name }}</button></sc-for></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: '404' };
    this._kind = '404';
  }

  renderVals() {
    const { kind } = this.state;
    this._kind = kind;
    const V = {
      '404': {
        code: '404', codeCls: 'code', color: '#5CE1FF', kicker: 'Page not found', title: 'Signal lost.',
        body: 'The page you were tracking has gone off the map. It may have moved, or the link is out of date.',
        primary: 'Return to dashboard', secondary: 'Open mission log', badge: 'Link lost', badgeCls: 'badge b-man', link: 'No route',
        rows: [['Requested', '[REQUESTED PATH]'], ['Last route', '/dashboard'], ['Status', 'HTTP 404'], ['Time', 'now']],
      },
      '500': {
        code: '500', codeCls: 'code err', color: '#FF6A3D', kicker: 'Server error', title: 'Link failure.',
        body: 'Something failed on our side while loading this view. Your missions and reports are not affected. Try again in a moment.',
        primary: 'Try again', secondary: 'View system status', badge: 'Incident', badgeCls: 'badge b-crit', link: 'Link down',
        rows: [['Reference', 'ERR-[REQUEST ID]'], ['Service', '[FAILING SERVICE]'], ['Status', 'HTTP 500'], ['Time', 'now']],
      },
    }[kind];
    V.rows = V.rows.map(([k, v]) => ({ k, v: v === 'now' ? new Date().toISOString().slice(11, 19) + ' UTC' : v }));
    return {
      v: V,
      variants: [['404', '404 · Not found'], ['500', '500 · Error']].map(([k, name]) => ({ name, cls: kind === k ? 'on' : '', pick: () => this.setState({ kind: k }) })),
    };
  }

  componentDidMount() { this._alive = true; this._boot(0); }
  componentWillUnmount() { this._alive = false; if (this._raf) cancelAnimationFrame(this._raf); }

  _boot(tries) {
    if (!this._alive) return;
    const canvas = document.querySelector('[data-gl="lost"]');
    if (!canvas) { if (tries < 120) requestAnimationFrame(() => this._boot(tries + 1)); return; }
    this._loop([this._lostScene(this._engine(), canvas)]);
  }

  // Drifting aircraft over fogged terrain; the link to the ground station keeps dropping out.
  _lostScene(K, canvas) {
    const R = K.renderer(canvas, [0.008, 0.024, 0.06]);
    if (!R) return null;
    const { Batch, COL, a, lerp, smooth } = K;
    const self = this;
    const ground = (x, z) => 10 * Math.sin(x * 0.03 + 1.2) * Math.cos(z * 0.025) + 5 * Math.sin(x * 0.07 + z * 0.05) + 3 * Math.cos(z * 0.1);
    const tb = new Batch();
    for (let g = -200; g <= 200; g += 10) for (let u = -200; u < 200; u += 5) {
      const c = (h) => [lerp(0.12, 0.36, smooth(-10, 16, h)), lerp(0.24, 0.58, smooth(-10, 16, h)), lerp(0.55, 0.9, smooth(-10, 16, h)), 0.14 + 0.2 * smooth(-10, 16, h)];
      const h1 = ground(u, g), h2 = ground(u + 5, g), k1 = ground(g, u), k2 = ground(g, u + 5);
      tb.line(u, h1, g, u + 5, h2, g, c(h1), c(h2));
      tb.line(g, k1, u, g, k2, u + 5, c(k1), c(k2));
    }
    const terrain = new Float32Array(tb.a);
    const tower = [-40, ground(-40, 30), 30];
    return {
      frame(t) {
        const asp = R.resize();
        const err = self._kind === '500';
        const cy = 0.9 + t * 0.02, rad = 120 * Math.max(1, 1.3 / asp);
        const T = [18, 20, 0];
        const eye = [T[0] + rad * Math.cos(0.32) * Math.sin(cy), T[1] + rad * Math.sin(0.32), T[2] + rad * Math.cos(0.32) * Math.cos(cy)];
        const M = K.camera(asp, eye, T, 0.75);
        R.begin(M, eye, 60, 260);
        R.draw(terrain, 'lines', 'add');
        const ln = new Batch(), pts = new Batch();
        const dx = 30 + Math.sin(t * 0.37) * 8, dy = 30 + Math.sin(t * 0.8) * 2.5, dz = -6 + Math.cos(t * 0.29) * 7;
        const wob = Math.sin(t * 1.3) * 0.35;
        const tone = err ? COL.crit : COL.white;
        const flick = Math.sin(t * 23) > 0.3 && Math.sin(t * 3.1) > -0.4 ? 1 : 0.1;
        self._drawDrone(K, ln, dx, dy, dz, t * 0.4 + wob, 2.2, err ? 0 : t * (0.3 + 0.7 * flick), { color: a(tone, 0.4 + 0.6 * flick), rotor: err ? COL.crit : COL.blue });
        // ground station mast
        ln.line(tower[0], tower[1], tower[2], tower[0], tower[1] + 18, tower[2], a(COL.cyan, 0.8));
        ln.line(tower[0] - 4, tower[1], tower[2] - 4, tower[0], tower[1] + 18, tower[2], a(COL.cyan, 0.5));
        ln.line(tower[0] + 4, tower[1], tower[2] + 4, tower[0], tower[1] + 18, tower[2], a(COL.cyan, 0.5));
        for (let r = 1; r <= 3; r++) { const ph = (t * 0.5 + r / 3) % 1; ln.ring(tower[0], tower[1] + 18, tower[2], 2 + ph * 12, 24, a(COL.cyan, 0.4 * (1 - ph))); }
        // broken link: dashes that appear and vanish
        const top = [tower[0], tower[1] + 18, tower[2]], seg = 24;
        for (let k = 0; k < seg; k++) {
          const on = Math.sin(t * 6 + k * 1.7) > (err ? 0.4 : 0.1) && k % 2 === 0;
          if (!on) continue;
          const u1 = k / seg, u2 = (k + 0.6) / seg;
          ln.line(lerp(top[0], dx, u1), lerp(top[1], dy, u1), lerp(top[2], dz, u1), lerp(top[0], dx, u2), lerp(top[1], dy, u2), lerp(top[2], dz, u2), a(err ? COL.crit : COL.warn, 0.7 * (1 - u1 * 0.6)));
        }
        pts.v(dx, dy - 4, dz, a(err ? COL.crit : COL.cyan, 0.35 * flick));
        pts.v(top[0], top[1], top[2], a(COL.cyan, 0.9));
        R.draw(ln, 'lines', 'add');
        R.draw(pts, 'points', 'add', 80);
      },
    };
  }

  /*SHARED*/
}
</script>
</body>
</html>
